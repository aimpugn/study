<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>조립 화면 시안 2</title>
<style>
:root{--bg:#fbfaf7;--card:#ffffff;--line:#d9d6cc;--ink:#2c2c2a;--sub:#5f5e5a;--mute:#888780;--acc:#534AB7;--accbg:#EEEDFE;--file:#D85A30;--filebg:#FAECE7;--ent:#0F6E56;--bar:#B4B2A9;--barbg:#F1EFE8}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1f1e1c;--card:#2a2927;--line:#444441;--ink:#f1efe8;--sub:#d3d1c7;--mute:#b4b2a9;--acc:#AFA9EC;--accbg:#3C3489;--file:#F0997B;--filebg:#712B13;--ent:#5DCAA5;--bar:#5F5E5A;--barbg:#2C2C2A}}
:root[data-theme="dark"]{--bg:#1f1e1c;--card:#2a2927;--line:#444441;--ink:#f1efe8;--sub:#d3d1c7;--mute:#b4b2a9;--acc:#AFA9EC;--accbg:#3C3489;--file:#F0997B;--filebg:#712B13;--ent:#5DCAA5;--bar:#5F5E5A;--barbg:#2C2C2A}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.5 system-ui,-apple-system,"Apple SD Gothic Neo",sans-serif}
main{max-width:1180px;margin:0 auto;padding:16px}
.top{display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin-bottom:12px}
.sql{font:600 15px ui-monospace,Menlo,monospace;background:var(--card);border:1px solid var(--line);border-radius:8px;padding:6px 12px}
.chip{font-size:12px;color:var(--sub);border:1px solid var(--line);border-radius:999px;padding:2px 10px}
.comps{display:grid;grid-template-columns:repeat(auto-fit,minmax(118px,1fr));gap:8px;margin-bottom:12px}
.comp{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:8px 10px;min-height:58px;position:relative;cursor:pointer}
.comp .n{font-weight:600;font-size:13px}
.comp .k{font-size:11px;color:var(--mute);font-family:ui-monospace,Menlo,monospace;overflow-wrap:anywhere}
.comp .b{height:5px;background:var(--barbg);border-radius:3px;margin-top:6px;overflow:hidden}
.comp .b i{display:block;height:100%;width:0;background:var(--bar)}
.comp.on{border:2px solid var(--acc);background:var(--accbg)}
.comp.on .b i{background:var(--acc)}
.comp.sel{outline:2px dashed var(--acc);outline-offset:2px}
.panel{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px}
svg text{fill:var(--sub);font-size:11px}
.ctl{display:flex;gap:8px;align-items:center;margin:12px 0;flex-wrap:wrap}
button{font:inherit;background:var(--card);color:var(--ink);border:1px solid var(--line);border-radius:8px;padding:4px 12px;cursor:pointer}
button[aria-pressed="true"]{background:var(--accbg);border-color:var(--acc)}
input[type=range]{flex:1;min-width:160px;accent-color:var(--acc)}
.now{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:12px}
@media (max-width:760px){.now{grid-template-columns:minmax(0,1fr)}}
.stack{font:12px/1.7 ui-monospace,Menlo,monospace;color:var(--sub);overflow-wrap:anywhere}
.stack b{color:var(--ink)}
.src{font:12px ui-monospace,Menlo,monospace;color:var(--sub)}
.big{font-size:20px;font-weight:600}
.leg{display:flex;gap:14px;font-size:12px;color:var(--sub);flex-wrap:wrap;margin-top:6px}
.sw{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:4px;vertical-align:-1px}
</style>
</head>
<body>
<main>
<div class="top">
  <span class="sql">SELECT * FROM t</span>
  <span class="chip">PostgreSQL 18.6 · 백엔드 5253 · 함수 호출 27,869번 · 39.2ms</span>
  <span class="chip">서버를 다시 띄운 직후(공유 버퍼가 빈 상태)</span>
</div>

<div class="comps" id="comps"></div>

<div class="panel">
  <svg id="tl" width="100%" viewBox="0 0 1140 300" role="img" aria-label="시간에 따른 호출 나무와 파일 읽기"></svg>
  <div class="leg">
    <span><span class="sw" style="background:var(--bar)"></span>함수(가로 길이 = 걸린 시간, 아래로 = 호출 깊이)</span>
    <span><span class="sw" style="background:var(--acc)"></span>지금 단계</span>
    <span><span class="sw" style="background:var(--file)"></span>파일 읽기(strace)</span>
    <span><span class="sw" style="background:var(--ent)"></span>공유 버퍼에 들어간 순간</span>
  </div>
</div>

<div class="ctl">
  <button id="prev" aria-label="이전 단계">◀</button>
  <button id="next" aria-label="다음 단계">▶</button>
  <input type="range" id="slider" min="0" value="0" step="1" aria-label="단계">
  <span id="pos" class="src"></span>
  <span class="src">깊이</span>
  <button data-depth="1">1</button><button data-depth="2">2</button><button data-depth="3" aria-pressed="true">3</button>
</div>

<div class="now">
  <div class="panel">
    <div class="big" id="fn"></div>
    <div class="src" id="from"></div>
    <div class="src" id="calls"></div>
  </div>
  <div class="panel"><div class="stack" id="stack"></div></div>
</div>
</main>

const COMPS = [
  ["요청 처리","tcop",m=>m==="tcop"||m==="libpq"],
  ["구문 분석","parser",m=>m==="parser"||m==="rewrite"],
  ["계획","optimizer",m=>m.startsWith("optimizer")],
  ["실행기","executor",m=>m==="executor"],
  ["테이블·인덱스","access/*",m=>m.startsWith("access/")&&m!=="access/transam"],
  ["카탈로그 캐시","utils/cache",m=>m==="utils/cache"||m==="catalog"],
  ["공유 버퍼","storage/buffer",m=>m==="storage/buffer"],
  ["파일","storage/smgr, file",m=>m==="storage/smgr"||m==="storage/file"],
  ["비동기 I/O","storage/aio",m=>m==="storage/aio"],
  ["잠금","storage/lmgr, ipc",m=>m==="storage/lmgr"||m==="storage/ipc"],
  ["트랜잭션","access/transam",m=>m==="access/transam"||m==="utils/time"],
  ["메모리","utils/mmgr",m=>m==="utils/mmgr"],
  ["기타","나머지",m=>true]
];
const compOf=m=>COMPS.findIndex(c=>c[2](m));
const tree=ROWS.map(r=>({kind:"tree",d:r[0],fn:r[1],mod:r[2],calls:r[3],t0:r[4],t1:r[5],from:r[6]}));
const stk=[];
tree.forEach(n=>{stk.length=n.d;n.parent=n.d?stk[n.d-1]:null;stk[n.d]=n;if(n.parent)n.parent.hasKids=true;});
tree.forEach(n=>{let p=n;while(p&&p.mod.startsWith("include"))p=p.parent;n.comp=compOf(p?p.mod:n.mod);});
const ents=ENT.map(e=>{
  let host=null;tree.forEach(n=>{if(n.t0<=e[0]&&e[1]<=n.t1&&(!host||n.d>host.d))host=n;});
  return {kind:"ent",t0:e[0],t1:e[1],calls:e[2],mod:e[3],from:e[4],tail:e[5],fn:e[5][e[5].length-1],parent:host,comp:compOf(e[3])};
});
const T=tree[0].t1, W=1060, X0=70;
const x=t=>X0+t/T*W;
const svg=document.getElementById("tl");
const NS="http://www.w3.org/2000/svg";
function el(tag,a,text){const e=document.createElementNS(NS,tag);for(const k in a)e.setAttribute(k,a[k]);if(text!=null)e.textContent=text;svg.appendChild(e);return e;}
el("text",{x:4,y:22},"백엔드");el("text",{x:4,y:36},"호출 나무");
tree.forEach(n=>{
  const w=Math.max(1.5,x(n.t1)-x(n.t0));
  n.rect=el("rect",{x:x(n.t0),y:12+n.d*30,width:w,height:24,rx:2});
  if(w>90){n.lab=el("text",{x:x(n.t0)+6,y:28+n.d*30,"pointer-events":"none"},n.fn.length*6.2>w-10?n.fn.slice(0,Math.floor((w-16)/6.2))+"…":n.fn);}
  n.rect.addEventListener("click",()=>jump(n));
});
el("text",{x:4,y:146},"공유 버퍼");el("text",{x:4,y:160},"들어감");
ents.forEach(e=>{e.rect=el("rect",{x:x(e.t0)-2,y:134,width:Math.max(4,x(e.t1)-x(e.t0)),height:30,rx:1});e.rect.addEventListener("click",()=>jump(e));});
el("text",{x:4,y:196},"백엔드");el("text",{x:4,y:210},"파일 읽기");
el("text",{x:4,y:246},"I/O 워커");el("text",{x:4,y:260},"파일 읽기");
EV.forEach(e=>{const y=e[0]?232:182;
  if(e[2]==="pread64")el("rect",{x:x(e[1])-2,y,width:4,height:30,fill:"var(--file)"});
  else el("rect",{x:x(e[1])-1,y:y+8,width:2,height:14,fill:"var(--file)",opacity:0.5});});
for(let ms=0;ms<=T/1000;ms+=10){el("line",{x1:x(ms*1000),x2:x(ms*1000),y1:272,y2:278,stroke:"var(--mute)"});el("text",{x:x(ms*1000)-8,y:292},ms+"ms");}
const cursor=el("line",{x1:X0,x2:X0,y1:6,y2:270,stroke:"var(--acc)","stroke-width":1.5});
const compsEl=document.getElementById("comps");
const tiles=COMPS.map((c,ci)=>{const d=document.createElement("div");d.className="comp";d.innerHTML=`<div class="n">${c[0]}</div><div class="k">${c[1]}</div><div class="b"><i></i></div>`;compsEl.appendChild(d);d.addEventListener("click",()=>{selComp=selComp===ci?-1:ci;rebuild();});return d;});
let depth=3, view=[], cur=0, selComp=-1;
const slider=document.getElementById("slider");
function rebuild(keep){
  const n=keep||view[cur];
  const all=tree.filter(v=>v.d<=depth).concat(ents).sort((a,b)=>a.t0-b.t0||(a.kind==="ent")-(b.kind==="ent"));
  view=selComp<0?all:all.filter(v=>v.comp===selComp);
  if(!view.length)view=all;
  const i=view.indexOf(n);cur=i>=0?i:Math.max(0,view.findIndex(v=>n&&v.t0>=n.t0));
  slider.max=view.length-1;
  document.querySelectorAll("[data-depth]").forEach(b=>b.setAttribute("aria-pressed",String(+b.dataset.depth===depth)));
  render();
}
function jump(n){if(n.kind==="tree"&&n.d>depth){depth=n.d;}rebuild(n);}
function go(i){cur=Math.min(view.length-1,Math.max(0,i));render();}
function chainOf(n){const c=[];if(n.kind==="ent"){let p=n.parent;const up=[];while(p){up.unshift(p);p=p.parent;}return {up,tail:n.tail.slice(Math.max(0,up.length-4))};}let p=n;while(p){c.unshift(p);p=p.parent;}return {up:c,tail:[]};}
function render(){
  const n=view[cur];slider.value=cur;
  document.getElementById("pos").textContent=`${cur+1} / ${view.length}`;
  const cnt=COMPS.map(()=>0);
  tree.concat(ents).forEach(v=>{if(v.t0<=n.t0&&(v.kind==="ent"||(v.d<=depth&&(!v.parent||v.parent.comp!==v.comp))))cnt[v.comp]++;});
  const max=Math.max(...cnt,1);
  tiles.forEach((t,ci)=>{t.classList.toggle("on",ci===n.comp);t.classList.toggle("sel",ci===selComp);t.querySelector("i").style.width=(cnt[ci]/max*100)+"%";});
  const anc=new Set();let p=n.kind==="ent"?n.parent:n;while(p){anc.add(p);p=p.parent;}
  tree.forEach(v=>{
    const dim=selComp>=0&&v.comp!==selComp;
    v.rect.setAttribute("fill",(v===n||anc.has(v))?"var(--acc)":"var(--bar)");
    v.rect.setAttribute("opacity",v===n?1:anc.has(v)?0.45:(v.d>depth||dim)?0.15:0.8);
  });
  ents.forEach(e=>{e.rect.setAttribute("fill",e===n?"var(--acc)":"var(--ent)");e.rect.setAttribute("opacity",e===n?1:(selComp>=0&&e.comp!==selComp)?0.2:0.85);});
  cursor.setAttribute("x1",x(n.t0));cursor.setAttribute("x2",x(n.t0));
  document.getElementById("fn").textContent=n.fn;
  document.getElementById("from").textContent="부른 자리 "+n.from;
  document.getElementById("calls").textContent=`이 아래 호출 ${n.calls.toLocaleString()}번 · ${((n.t1-n.t0)/1000).toFixed(2)}ms`;
  const ch=chainOf(n);
  const lines=ch.up.map((c,k)=>`${"&nbsp;&nbsp;".repeat(k)}${c===n?"<b>":""}${c.fn}${c===n?"</b>":""} <span style="color:var(--mute)">${COMPS[c.comp][0]}</span>`);
  if(n.kind==="ent"){const tl=ch.tail,keep=6,cut=Math.max(0,tl.length-keep);if(cut>0)lines.push(`${"&nbsp;&nbsp;".repeat(ch.up.length)}<span style="color:var(--mute)">… ${cut}칸 접음</span>`);tl.slice(cut).forEach((f,k,arr)=>{const last=k===arr.length-1;lines.push(`${"&nbsp;&nbsp;".repeat(ch.up.length+1)}${last?"<b>":""}${f}${last?"</b>":""}${last?` <span style="color:var(--mute)">${COMPS[n.comp][0]}</span>`:""}`);});}
  document.getElementById("stack").innerHTML=lines.join("<br>");
}
document.getElementById("prev").onclick=()=>go(cur-1);
document.getElementById("next").onclick=()=>go(cur+1);
slider.oninput=()=>go(+slider.value);
document.querySelectorAll("[data-depth]").forEach(b=>b.onclick=()=>{depth=+b.dataset.depth;rebuild();});
document.addEventListener("keydown",e=>{if(e.key==="ArrowRight")go(cur+1);if(e.key==="ArrowLeft")go(cur-1);});
rebuild(tree[0]);
const q=new URLSearchParams(location.search);
if(q.get("comp")){selComp=+q.get("comp");rebuild();}
if(q.get("step"))go(+q.get("step"));
</script>
