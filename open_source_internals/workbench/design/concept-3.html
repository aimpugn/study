<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>요청 하나의 여정</title>
<style>
:root{--bg:#fbfaf7;--card:#ffffff;--line:#d9d6cc;--ink:#2c2c2a;--sub:#5f5e5a;--mute:#888780;--acc:#534AB7;--accbg:#EEEDFE;
--client:#5F5E5A;--clientbg:#F1EFE8;--local:#185FA5;--localbg:#E6F1FB;--shared:#534AB7;--sharedbg:#EEEDFE;--proc:#0F6E56;--procbg:#E1F5EE;--disk:#993C1D;--diskbg:#FAECE7;--cat:#B4B2A9;--catbg:#F1EFE8;--hl:#FAEEDA}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1f1e1c;--card:#2a2927;--line:#444441;--ink:#f1efe8;--sub:#d3d1c7;--mute:#b4b2a9;--acc:#AFA9EC;--accbg:#3C3489;
--client:#D3D1C7;--clientbg:#444441;--local:#85B7EB;--localbg:#0C447C;--shared:#AFA9EC;--sharedbg:#3C3489;--proc:#5DCAA5;--procbg:#085041;--disk:#F0997B;--diskbg:#712B13;--cat:#888780;--catbg:#2C2C2A;--hl:#633806}}
:root[data-theme="dark"]{--bg:#1f1e1c;--card:#2a2927;--line:#444441;--ink:#f1efe8;--sub:#d3d1c7;--mute:#b4b2a9;--acc:#AFA9EC;--accbg:#3C3489;
--client:#D3D1C7;--clientbg:#444441;--local:#85B7EB;--localbg:#0C447C;--shared:#AFA9EC;--sharedbg:#3C3489;--proc:#5DCAA5;--procbg:#085041;--disk:#F0997B;--diskbg:#712B13;--cat:#888780;--catbg:#2C2C2A;--hl:#633806}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.5 system-ui,-apple-system,"Apple SD Gothic Neo",sans-serif}
main{max-width:1440px;margin:0 auto;padding:12px 16px}
.top{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:10px}
.top h1{font-size:16px;margin:0 6px 0 0}
button{font:inherit;font-size:13px;background:var(--card);color:var(--ink);border:1px solid var(--line);border-radius:8px;padding:3px 11px;cursor:pointer}
button[aria-pressed="true"]{background:var(--accbg);border-color:var(--acc);font-weight:600}
.ctl{display:flex;gap:6px;align-items:center;margin-left:auto}
.ctl .n{font:600 13px ui-monospace,Menlo,monospace;min-width:64px;text-align:center}
.ctl .t{font-size:12px;color:var(--mute)}
.grid{display:grid;grid-template-columns:minmax(0,1fr) 520px;gap:12px;align-items:start}
@media (max-width:1100px){.grid{grid-template-columns:minmax(0,1fr)}}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 12px}
.term{font:13px/1.45 ui-monospace,Menlo,monospace;background:#1f1e1c;color:#f1efe8;border-radius:10px;padding:8px 12px;margin-bottom:10px;white-space:pre;min-height:52px;overflow-x:auto}
.term .p{color:#97C459}.term .w{color:#888780}
.lanes{overflow:hidden}
.flow{max-height:calc(100vh - 232px);min-height:360px;overflow-y:auto;overflow-x:auto}
svg text{font-family:system-ui,-apple-system,"Apple SD Gothic Neo",sans-serif}
.mono{font-family:ui-monospace,Menlo,monospace}
.row{cursor:pointer}
.d h2{font-size:15px;margin:0 0 2px}
.d .meta{font-size:12px;color:var(--mute);margin-bottom:8px}
.d .sec{font-size:11px;color:var(--mute);margin:10px 0 4px;letter-spacing:.02em}
.bytes{display:flex;flex-wrap:wrap;gap:6px}
.msg{display:flex;border:1px solid var(--line);border-radius:6px;overflow:hidden;font:12px ui-monospace,Menlo,monospace}
.msg span{padding:3px 6px;border-right:1px solid var(--line);white-space:nowrap}
.msg span:last-child{border-right:0}
.msg .ty{font-weight:700;color:#fff}
.msg .ln{color:var(--sub);background:var(--bg)}
.msg .bd{color:var(--ink)}
.msg.new{outline:2px solid var(--acc);outline-offset:1px}
.msg.old{opacity:.55}
.ruler{height:8px;background:var(--bg);border:1px solid var(--line);border-radius:4px;margin-top:6px;position:relative;overflow:hidden}
.ruler i{position:absolute;top:0;bottom:0;left:0;background:var(--local)}
.small{font-size:12px;color:var(--sub)}
.chips{display:flex;flex-wrap:wrap;gap:4px}
.chip{font:11px ui-monospace,Menlo,monospace;border:1px solid var(--line);border-radius:999px;padding:1px 8px;color:var(--sub);background:var(--bg)}
.stk{font:12px/1.65 ui-monospace,Menlo,monospace;max-height:210px;overflow-y:auto;border:1px solid var(--line);border-radius:8px;padding:4px 0}
.stk div{padding:0 8px;cursor:pointer;display:flex;gap:8px;white-space:nowrap}
.stk div:hover{background:var(--bg)}
.stk div.on{background:var(--accbg)}
.stk .fn{color:var(--ink)}
.stk .at{color:var(--mute);margin-left:auto}
.stk .fold{color:var(--mute);font-style:italic}
.code{font:12px/1.55 ui-monospace,Menlo,monospace;border:1px solid var(--line);border-radius:8px;overflow:auto;max-height:340px;background:var(--bg)}
.code div{white-space:pre;padding:0 8px 0 0;display:flex}
.code .no{color:var(--mute);min-width:44px;text-align:right;padding-right:10px;user-select:none}
.code .cm{color:var(--mute)}
.code .on{background:var(--hl)}
.path{font:12px ui-monospace,Menlo,monospace;color:var(--sub);margin-bottom:4px}
.leg{display:flex;gap:12px;font-size:12px;color:var(--sub);flex-wrap:wrap;margin-top:8px}
.sw{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:4px;vertical-align:-1px}
</style>
</head>
<body>
<main>
<div class="top">
  <h1>요청 하나의 여정</h1>
  <button id="q-update" data-q="update">UPDATE</button>
  <button id="q-select" data-q="select">SELECT</button>
  <div class="ctl">
    <button id="first" aria-label="처음">⏮</button>
    <button id="prev" aria-label="이전">◀</button>
    <span class="n" id="pos"></span>
    <button id="next" aria-label="다음">▶</button>
    <button id="last" aria-label="끝">⏭</button>
    <button id="play">재생</button>
    <span class="t" id="clock"></span>
  </div>
</div>
<div class="grid">
  <section>
    <div class="term" id="term"></div>
    <div class="card">
      <svg class="lanes" id="heads" width="100%" viewBox="0 0 860 58" role="img" aria-label="구성 요소"></svg>
      <div class="flow" id="flow"></div>
      <div class="leg">
        <span><span class="sw" style="background:var(--local)"></span>백엔드 프로세스 메모리</span>
        <span><span class="sw" style="background:var(--shared)"></span>공유 메모리</span>
        <span><span class="sw" style="background:var(--proc)"></span>다른 서버 프로세스</span>
        <span><span class="sw" style="background:var(--disk)"></span>디스크 파일</span>
        <span><span class="sw" style="background:var(--cat)"></span>카탈로그 조회(눌러서 펼침)</span>
      </div>
    </div>
  </section>
  <section class="card d" id="detail"></section>
</div>
</main>

  {id:"data_files", name:"데이터 파일", sub:"base/, global/", zone:"disk"},
  {id:"wal_files", name:"WAL 파일", sub:"pg_wal/", zone:"disk"},
];
const W = 860, LEFT = 104, GAP = (W - LEFT - 16) / LANES.length;
const X = {}; LANES.forEach((l, i) => X[l.id] = LEFT + GAP * (i + .5));
const MSGCOLOR = {Q:"#185FA5", T:"#0F6E56", D:"#3B6D11", C:"#534AB7", Z:"#993C1D", E:"#A32D2D"};
const SYSKINDS = ["요청 받음", "응답 보냄", "페이지 읽기", "WAL 쓰기", "디스크까지 동기화", "새 파일", "페이지 쓰기"];
const isSys = h => SYSKINDS.some(k => h.kind.startsWith(k));
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const relName = f => REL[f] || "";
const kb = b => b >= 1024 ? (b / 1024).toFixed(b % 1024 ? 1 : 0) + " KB" : b + " B";

let Q = "update", cur = 0, open = {}, frameSel = null, playing = null;

// 단계마다 이동을 모읍니다. 잇달은 카탈로그 이동은 접힌 묶음 하나가 되고, 펼치면 그 안의 이동이 각각 한 단계가 됩니다.
function buildRows(q) {
  const d = DATA[q], rows = [];
  d.stages.forEach((s, si) => {
    const hs = d.hops.filter(h => h.stage === s.name);
    if (s.fn) rows.push({type:"stage", stage:s, si});
    let i = 0;
    while (i < hs.length) {
      if (hs[i].catalog) {
        const g = [];
        while (i < hs.length && hs[i].catalog) g.push(hs[i++]);
        const key = s.name;
        rows.push({type:"cat", hops:g, key, si});
        if (open[key]) g.forEach(h => rows.push({type:"hop", hop:h, si, inCat:true}));
      } else rows.push({type:"hop", hop:hs[i++], si});
    }
  });
  return rows;
}

function hopLabel(h) {
  const n = h.count > 1 ? " ×" + h.count : "";
  if (h.kind === "요청 받음") return `요청 ${h.bytes} B`;
  if (h.kind === "응답 보냄") return `응답 ${h.bytes} B 한 번에`;
  if (h.kind === "응답 버퍼에 쓰기") return `${(h.msgs || []).map(m => m.type)[0] || "?"}${n} 쓰기`;
  if (h.kind.startsWith("페이지 읽기")) { const f = (h.files || [])[0] || ""; return `${kb(h.bytes)} 읽기 · ${relName(f) || f}`; }
  if (h.kind === "WAL 쓰기") return `${kb(h.bytes)} 쓰기`;
  if (h.kind === "디스크까지 동기화") return "fdatasync";
  if (h.kind === "읽기 맡기기") return "읽기 맡김";
  return h.kind + n;
}
function caller(h) { const s = h.stack || []; return s.length >= 2 ? s[s.length - 2].fn : ""; }

function laneHeads() {
  const zones = [["client","psql 프로세스",0,0],["local","백엔드 프로세스",1,2],["shared","공유 메모리",3,4],["proc","I/O 워커",5,5],["disk","디스크",6,7]];
  let s = "";
  zones.forEach(([z, name, a, b]) => {
    const x0 = LEFT + GAP * a + 3, x1 = LEFT + GAP * (b + 1) - 3;
    s += `<rect x="${x0}" y="2" width="${x1 - x0}" height="14" rx="4" fill="var(--${z}bg)"/><text x="${(x0 + x1) / 2}" y="13" text-anchor="middle" font-size="10" fill="var(--${z})">${name}</text>`;
  });
  LANES.forEach(l => {
    const worker = DATA[Q].hops.find(h => h.proc === "other");
    const sub = l.id === "backend" ? "pid " + DATA[Q].pid : l.id === "io_worker" ? (worker ? "pid " + worker.pid : "") : l.sub;
    s += `<rect x="${X[l.id] - GAP / 2 + 4}" y="20" width="${GAP - 8}" height="34" rx="6" fill="var(--card)" stroke="var(--${l.zone})"/>`;
    s += `<text x="${X[l.id]}" y="35" text-anchor="middle" font-size="12" font-weight="600" fill="var(--ink)">${l.name}</text>`;
    s += `<text x="${X[l.id]}" y="48" text-anchor="middle" font-size="9.5" fill="var(--mute)" class="mono">${esc(sub)}</text>`;
  });
  s += `<text x="8" y="48" font-size="11" fill="var(--mute)">단계</text>`;
  document.getElementById("heads").innerHTML = s;
}

function rowH(r) { return r.type === "stage" ? 21 : r.type === "cat" ? 30 : r.inCat ? 23 : 27; }

function laneColor(h) {
  if (h.proc === "other" || h.to === "io_worker") return "var(--proc)";
  if (h.to === "comm_buffer" || h.from === "comm_buffer") return "var(--local)";
  if (h.to === "wal_buffer" || h.to === "shared_buffer") return "var(--shared)";
  return "var(--disk)";
}

function draw() {
  const rows = buildRows(Q);
  if (cur >= rows.length) cur = rows.length - 1;
  let y = 6, body = "", bands = "";
  const ys = rows.map(r => { const top = y; y += rowH(r); return top; });
  const H = y + 8;
  // 단계 띠: 같은 단계의 줄을 한 배경으로 묶고 왼쪽에 단계 이름을 둡니다.
  const d = DATA[Q];
  d.stages.forEach((s, si) => {
    const idx = rows.map((r, i) => r.si === si ? i : -1).filter(i => i >= 0);
    let top, bot;
    if (idx.length) { top = ys[idx[0]]; bot = ys[idx[idx.length - 1]] + rowH(rows[idx[idx.length - 1]]); }
    else return;
    bands += `<rect x="0" y="${top}" width="${W}" height="${bot - top}" fill="${si % 2 ? "var(--bg)" : "var(--card)"}"/>`;
    bands += `<text x="8" y="${top + 15}" font-size="12" font-weight="600" fill="var(--ink)">${s.name}</text>`;
  });
  let lifelines = "";
  LANES.forEach(l => lifelines += `<line x1="${X[l.id]}" y1="0" x2="${X[l.id]}" y2="${H}" stroke="var(--line)" stroke-dasharray="3 4"/>`);
  let anim = "";
  rows.forEach((r, i) => {
    const top = ys[i], h = rowH(r), mid = top + h / 2;
    const op = i > cur ? .22 : 1;
    let g = `<g class="row" data-i="${i}" opacity="${op}">`;
    g += `<rect x="${LEFT - 4}" y="${top + 1}" width="${W - LEFT}" height="${h - 2}" rx="6" fill="${i === cur ? "var(--accbg)" : "transparent"}"/>`;
    if (r.type === "stage") {
      g += `<rect x="${X.backend - 5}" y="${top + 4}" width="10" height="${h - 8}" rx="2" fill="var(--local)"/>`;
      g += `<text x="${X.backend + 12}" y="${mid + 4}" font-size="11" fill="var(--sub)" class="mono">${esc(r.stage.fn)}()</text>`;
    } else if (r.type === "cat") {
      const finds = r.hops.filter(h => h.kind === "버퍼 찾기").reduce((a, h) => a + h.count, 0);
      const reads = r.hops.filter(h => h.kind.startsWith("페이지 읽기")).reduce((a, h) => a + h.count, 0);
      const x0 = X.backend - 10, x1 = X.data_files + 14;
      g += `<rect x="${x0}" y="${top + 4}" width="${x1 - x0}" height="${h - 8}" rx="7" fill="var(--catbg)" stroke="var(--cat)" stroke-dasharray="${open[r.key] ? "0" : "4 3"}"/>`;
      g += `<text x="${x0 + 10}" y="${mid + 4}" font-size="12" fill="var(--ink)">${open[r.key] ? "▾" : "▸"} 카탈로그 조회 · 버퍼 찾기 ${finds}번${reads ? ` · 디스크에서 ${reads}쪽` : " · 디스크 0쪽"}</text>`;
    } else {
      const hp = r.hop, x1 = X[hp.from], x2 = X[hp.to], col = laneColor(hp);
      const small = r.inCat;
      if (hp.proc === "other") g += `<rect x="${X.io_worker - 5}" y="${top + 3}" width="10" height="${h - 6}" rx="2" fill="var(--proc)"/>`;
      if (x1 === x2) {
        // 제자리 일(fdatasync)은 생명선 왼쪽에 고리로 그립니다. 맨 오른쪽 칸에서도 글자가 잘리지 않습니다.
        g += `<path d="M${x1} ${mid - 6} h-20 v12 h20" fill="none" stroke="${col}" stroke-width="1.6" marker-end="url(#ah)"/>`;
        g += `<text x="${x1 - 26}" y="${mid + 4}" font-size="${small ? 10.5 : 12}" fill="var(--ink)" text-anchor="end">${esc(hopLabel(hp))}</text>`;
      } else {
        g += `<line x1="${x1}" y1="${mid + 4}" x2="${x2}" y2="${mid + 4}" stroke="${col}" stroke-width="${small ? 1.2 : 1.8}" marker-end="url(#ah)" color="${col}"/>`;
        const lx = Math.min(x1, x2) + 8, anchor = "start";
        g += `<text x="${lx}" y="${mid - 2}" font-size="${small ? 10.5 : 12}" fill="var(--ink)" text-anchor="${anchor}">${esc(hopLabel(hp))}${!small && !isSys(hp) ? `<tspan fill="var(--mute)" font-size="10" class="mono">  ${esc(caller(hp))}</tspan>` : ""}</text>`;
        if (i === cur) anim = `<circle r="4" cy="${mid + 4}" fill="${col}"><animate id="mv" attributeName="cx" from="${x1}" to="${x2}" dur="0.6s" begin="indefinite" fill="freeze"/></circle>`;
      }
      const nx = x1 === x2 ? x1 - 26 - 8 * hopLabel(hp).length - 16 : Math.min(x1, x2) - 13;
      g += `<circle cx="${nx}" cy="${mid}" r="${small ? 7 : 8}" fill="var(--card)" stroke="${col}"/><text x="${nx}" y="${mid + 3.5}" font-size="${small ? 8.5 : 9.5}" text-anchor="middle" fill="var(--ink)">${hp.n}</text>`;
    }
    g += "</g>";
    body += g;
  });
  const defs = `<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="context-stroke"/></marker></defs>`;
  const flow = document.getElementById("flow");
  flow.innerHTML = `<svg width="100%" viewBox="0 0 ${W} ${H}" role="img" aria-label="요청의 여정">${defs}${bands}${lifelines}${body}${anim}</svg>`;
  flow.querySelectorAll(".row").forEach(el => el.addEventListener("click", () => {
    const i = +el.dataset.i, r = rows[i];
    if (r.type === "cat") open[r.key] = !open[r.key];
    go(i);
  }));
  const mv = document.getElementById("mv"); if (mv && mv.beginElement) mv.beginElement();
  const rowEl = flow.querySelector(`.row[data-i="${cur}"]`);
  if (rowEl && rowEl.scrollIntoView) { const b = rowEl.getBoundingClientRect(), f = flow.getBoundingClientRect(); if (b.top < f.top || b.bottom > f.bottom) rowEl.scrollIntoView({block:"nearest"}); }
  document.getElementById("pos").textContent = `${cur + 1} / ${rows.length}`;
  const r = rows[cur];
  const t = r.type === "stage" ? r.stage.t0 : r.type === "cat" ? r.hops[0].t0 : r.hop.t0;
  document.getElementById("clock").textContent = `t = ${(t / 1000).toFixed(1)} ms (기록 중이라 실제보다 느림)`;
  terminal(rows);
  detail(r);
}

// 클라이언트 화면: 응답이 소켓으로 도착한 단계부터 psql이 보여 줄 결과를 그립니다.
function terminal(rows) {
  const d = DATA[Q];
  const sendIdx = rows.findIndex(r => r.type === "hop" && r.hop.kind === "응답 보냄");
  let s = `<span class="p">postgres=#</span> ${esc(d.query)};`;
  if (cur >= sendIdx && sendIdx >= 0) {
    const msgs = rows[sendIdx].hop.msgs || [];
    const T = msgs.find(m => m.type === "T"), Ds = msgs.filter(m => m.type === "D"), C = msgs.find(m => m.type === "C");
    if (T) {
      const cols = T.text.split(","), rowsv = Ds.map(m => m.text.split("|"));
      const w = cols.map((c, k) => Math.max(c.length, ...rowsv.map(r => r[k].length)));
      const num = cols.map((c, k) => rowsv.every(r => /^-?\d+$/.test(r[k])));
      const pad = (v, k) => num[k] ? v.padStart(w[k]) : v.padEnd(w[k]);
      s += "\n " + cols.map((c, k) => c.padStart(Math.floor((w[k] + c.length) / 2)).padEnd(w[k])).join(" | ");
      s += "\n" + w.map(n => "-".repeat(n + 2)).join("+");
      rowsv.forEach(r => s += "\n " + r.map(pad).join(" | "));
      s += `\n(${Ds.length} row${Ds.length === 1 ? "" : "s"})`;
    } else if (C) s += "\n" + esc(C.text);
    s += `\n\n<span class="p">postgres=#</span> `;
  } else s += `  <span class="w">⏎ 보냄 · 응답 기다리는 중…</span>`;
  document.getElementById("term").innerHTML = s;
}

function msgBlocks(msgs, newFrom, newTo) {
  return `<div class="bytes">${msgs.map((m, k) => {
    const body = m.type === "Q" ? m.text + "\\0" : m.type === "T" ? "열 " + m.text.replace(/,/g, ", ") : m.type === "D" ? m.text.replace(/\|/g, " | ") : m.type === "C" ? m.text + "\\0" : m.text;
    const hex = (m.len >>> 0).toString(16).padStart(8, "0").match(/../g).join(" ");
    const cls = newFrom === undefined ? "" : k >= newFrom && k < newTo ? "new" : "old";
    return `<div class="msg ${cls}" title="길이 ${m.len} = 자기 자신 4바이트 + 내용 ${m.len - 4}바이트"><span class="ty" style="background:${MSGCOLOR[m.type] || "#5F5E5A"}">${m.type}</span><span class="ln">${hex}</span><span class="bd">${esc(body)}</span></div>`;
  }).join("")}</div>`;
}

function detail(r) {
  const d = DATA[Q], el = document.getElementById("detail");
  let h = "";
  let stack = null, pick = null;
  if (r.type === "stage") {
    h += `<h2>${r.stage.name}: <span class="mono">${esc(r.stage.fn)}()</span></h2><div class="meta">exec_simple_query가 이 단계 함수를 부른 자리입니다.</div>`;
    stack = [{fn:"exec_simple_query", at:r.stage.at}, {fn:r.stage.fn, at:""}];
    pick = 0;
  } else if (r.type === "cat") {
    const names = []; r.hops.forEach(x => (x.files || []).forEach(f => { const n = relName(f) || f; if (!names.includes(n)) names.push(n); }));
    h += `<h2>카탈로그 조회 (${r.key})</h2><div class="meta">이 요청을 처리하는 데 필요한 정의(테이블, 열, 연산자, 통계)를 시스템 카탈로그에서 찾습니다. 공유 버퍼에 없던 페이지만 디스크에서 읽습니다.</div>`;
    h += `<div class="sec">디스크에서 읽은 카탈로그</div><div class="chips">${names.length ? names.map(n => `<span class="chip">${esc(n)}</span>`).join("") : `<span class="small">없음: 모두 공유 버퍼에 이미 있었습니다</span>`}</div>`;
    const first = r.hops[0]; stack = first.stack; h += `<div class="sec">첫 조회의 호출 스택</div>`;
  } else {
    const x = r.hop;
    const who = x.proc === "other" ? `I/O 워커 pid ${x.pid}` : `백엔드 pid ${x.pid}`;
    h += `<h2>${x.n}. ${esc(hopLabel(x))}</h2><div class="meta">${esc(x.kind)} · ${who}${x.files ? " · " + x.files.map(f => esc(f) + (relName(f) ? ` (${esc(relName(f))})` : "")).join(", ") : ""}</div>`;
    if (x.kind === "요청 받음" || x.kind === "응답 보냄") {
      h += `<div class="sec">소켓으로 오간 바이트 (${x.bytes} B, 메시지마다 종류 1바이트 · 길이 4바이트 · 내용)</div>` + msgBlocks(x.msgs || []);
      h += `<div class="ruler"><i style="width:${Math.max(1, x.bytes / 8192 * 100)}%"></i></div><div class="small">${x.kind === "요청 받음" ? "PqRecvBuffer" : "PqSendBuffer"} 8,192 B 중 ${x.bytes} B</div>`;
    } else if (x.kind === "응답 버퍼에 쓰기") {
      const rows = buildRows(Q), puts = [];
      rows.forEach(rr => { if (rr.type === "hop" && rr.hop.kind === "응답 버퍼에 쓰기") puts.push(rr.hop); });
      const all = [], k = puts.indexOf(x); let from = 0;
      puts.slice(0, k + 1).forEach((p, j) => { if (j === k) from = all.length; all.push(...(p.msgs || [])); });
      const used = all.reduce((a, m) => a + 1 + m.len, 0);
      h += `<div class="sec">통신 버퍼에 쌓인 메시지 (아직 소켓으로 나가지 않음)</div>` + msgBlocks(all, from, all.length);
      h += `<div class="ruler"><i style="width:${Math.max(1, used / 8192 * 100)}%"></i></div><div class="small">PqSendBuffer 8,192 B 중 ${used} B · 가득 차거나 ReadyForQuery가 flush할 때 한 번에 보냅니다</div>`;
    }
    stack = x.stack;
  }
  if (stack && stack.length) {
    if (pick === null) pick = r.type === "hop" && isSys(r.hop) ? stack.length - 1 : Math.max(0, stack.length - 2);
    if (frameSel !== null && frameSel < stack.length) pick = frameSel;
    // 긴 스택은 바깥 2칸과 안쪽 8칸만 둡니다. 카탈로그 조회면 무엇을 찾으려 했는지 보이도록 systable_* 를 부른 바로 위 6칸도 남깁니다.
    const keepHead = 2, keepTail = 8, fold = stack.length > keepHead + keepTail + 1 && !detail.unfold;
    const sysAt = stack.findIndex(f => f.fn.startsWith("systable_"));
    const keep = k => k < keepHead || k >= stack.length - keepTail || (sysAt >= 0 && k >= sysAt - 6 && k <= sysAt);
    h += r.type === "cat" ? "" : `<div class="sec">호출 스택 (바깥 → 안쪽, 누르면 그 줄의 소스)</div>`;
    h += `<div class="stk">` + stack.map((f, k) => {
      if (fold && !keep(k)) { if (k > 0 && !keep(k - 1)) return ""; let n = 0; for (let j = k; j < stack.length && !keep(j); j++) n++; return `<div class="fold" data-unfold="1">… ${n}칸 접음</div>`; }
      const at = f.at ? f.at.replace(/^src\//, "") : "";
      return `<div class="${k === pick ? "on" : ""}" data-k="${k}"><span class="fn">${"&nbsp;".repeat(Math.min(k, 10))}${esc(f.fn)}</span><span class="at">${esc(at.split("/").pop())}</span></div>`;
    }).join("") + `</div>`;
    const ref = stack[pick].at, ex = d.src[ref];
    if (ex) {
      const target = +ref.split(":").pop();
      h += `<div class="sec">소스</div><div class="path">${esc(ref.replace(/^src\//, ""))}</div><div class="code" id="code">` + ex.lines.map((ln, j) => {
        const no = ex.from + j, cm = /^\s*(\/\*|\*|\/\/)/.test(ln);
        return `<div class="${no === target ? "on" : ""}"><span class="no">${no}</span><span class="${cm ? "cm" : ""}">${esc(ln.replace(/\t/g, "    "))}</span></div>`;
      }).join("") + `</div>`;
    }
  }
  el.innerHTML = h;
  el.querySelectorAll(".stk div[data-k]").forEach(e => e.addEventListener("click", () => { frameSel = +e.dataset.k; detail(r); }));
  el.querySelectorAll(".stk div[data-unfold]").forEach(e => e.addEventListener("click", () => { detail.unfold = true; detail(r); }));
  const sf = el.querySelector(".stk div.on"); if (sf) { const b = sf.parentElement; b.scrollTop = sf.offsetTop - b.clientHeight / 2; }
  const on = el.querySelector(".code .on"); if (on) { const c = document.getElementById("code"); c.scrollTop = on.offsetTop - c.clientHeight / 2; }
}

function go(i) {
  const n = buildRows(Q).length;
  cur = Math.max(0, Math.min(n - 1, i)); frameSel = null; detail.unfold = false; draw();
}
function setQ(q) {
  Q = q; cur = 0; open = {};
  document.querySelectorAll("[data-q]").forEach(b => b.setAttribute("aria-pressed", b.dataset.q === q));
  laneHeads(); go(0);
}
document.querySelectorAll("[data-q]").forEach(b => b.addEventListener("click", () => setQ(b.dataset.q)));
document.getElementById("first").onclick = () => go(0);
document.getElementById("prev").onclick = () => go(cur - 1);
document.getElementById("next").onclick = () => go(cur + 1);
document.getElementById("last").onclick = () => go(1e9);
document.getElementById("play").onclick = e => {
  if (playing) { clearInterval(playing); playing = null; e.target.textContent = "재생"; return; }
  e.target.textContent = "멈춤";
  playing = setInterval(() => { if (cur >= buildRows(Q).length - 1) { clearInterval(playing); playing = null; e.target.textContent = "재생"; return; } go(cur + 1); }, 900);
};
document.addEventListener("keydown", e => { if (e.key === "ArrowRight") go(cur + 1); if (e.key === "ArrowLeft") go(cur - 1); });

// 주소의 #q=select&s=9&open=의미 분석 은 처음 보여 줄 상태입니다(화면 캡처와 공유용).
const hp = new URLSearchParams(location.hash.slice(1));
if (hp.get("open")) hp.get("open").split(",").forEach(k => open[k] = true);
const startQ = hp.get("q") === "select" ? "select" : "update";

cur = 0;
